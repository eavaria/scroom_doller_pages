<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Assistant Chat</title>
    <style>
        /* CSS for WhatsApp-like styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chat-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 600px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-header {
            background-color: #075e54;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background-color: #e5ddd5;
            background-image: url('https://web.whatsapp.com/img/bg-chat-tile-light_686b94cc439ebd3ff25a0a32f05c00f5.png');
            background-size: contain;
        }

        .message {
            max-width: 70%;
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 7px;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #dcf8c6;
            align-self: flex-end;
            margin-left: auto;
        }

        .bot-message {
            background-color: #fff;
            align-self: flex-start;
            margin-right: auto;
        }

        #chat-input {
            display: flex;
            padding: 10px;
            background-color: #f0f0f0;
        }

        #message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            margin-right: 10px;
        }

        #send-button {
            background-color: #075e54;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            #chat-container {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-header">Personal Assistant</div>
        <div id="chat-messages"></div>
        <div id="chat-input">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        // JavaScript for WebSocket connection and chat functionality
        const websocketUrl = 'wss://your-server.com/ws'; // Replace with your WebSocket server URL
        let socket;

        function connectWebSocket() {
            socket = new WebSocket(websocketUrl);

            socket.onopen = () => {
                console.log('WebSocket connected');
                addMessage('System', 'Connected to assistant.');
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data); // Assuming server sends JSON { message: 'text' }
                addMessage('Bot', data.message);
            };

            socket.onclose = () => {
                console.log('WebSocket disconnected');
                addMessage('System', 'Disconnected. Reconnecting...');
                setTimeout(connectWebSocket, 3000); // Auto-reconnect
            };

            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function addMessage(sender, text) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            if (sender === 'User') {
                messageDiv.classList.add('user-message');
            } else if (sender === 'Bot') {
                messageDiv.classList.add('bot-message');
            } else {
                messageDiv.style.backgroundColor = '#ccc';
                messageDiv.style.textAlign = 'center';
            }
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll
        }

        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (message && socket && socket.readyState === WebSocket.OPEN) {
                addMessage('User', message);
                socket.send(JSON.stringify({ message })); // Send as JSON
                input.value = '';
            }
        }

        // Initial connection
        connectWebSocket();
    </script>
</body>
</html>
